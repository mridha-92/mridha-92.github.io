# =====================================================================
#  Cyberpent Radar - Threat Intel Pipeline
#  Ingests feeds -> extracts CVE/IOCs -> synthesizes via Gemini ->
#  commits radar reports every 2h. Site rebuilds automatically.
# =====================================================================

name: Cyberpent Radar Pipeline

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-pipeline
  cancel-in-progress: false

jobs:
  ingest-synthesize-publish:
    name: Ingest / Synthesize / Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intelligence pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          MAX_POSTS_PER_RUN: "6"
          FEED_LOOKBACK_HOURS: "48"
        run: python scripts/run_pipeline.py

      - name: Commit and push new radar reports
        run: |
          git config user.name  "Cyberpent Bot"
          git config user.email "bot@cyberpent.cc.cd"

          mkdir -p _posts
          git add -A _posts scripts/state.json

          if git diff --cached --quiet; then
            echo "::notice::No new intelligence to publish this cycle."
            exit 0
          fi

          STAMP=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "radar: publish threat reports ${STAMP} [skip ci]"
          git push
